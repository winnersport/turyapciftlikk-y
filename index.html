<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TURYAP Yalova Çiftlikköy</title>
<style>
:root{--blue:#1E68A9;--navy:#144a78;--tint:#e8f1fa;--bg:#f3f6fa;--card:#fff;--tx:#18232f;--mut:#667689;--bd:#dde4ec;--ok:#12803c;--bad:#c0392b;--hd:#144a78;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1720;--card:#18222e;--tx:#eef2f6;--mut:#9aabbc;--bd:#283546;--tint:#1c2c3f;--ok:#4cc27a;--bad:#ff7b6b}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--blue);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:500}button.w{background:#fff;color:var(--navy)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--blue);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
header img{width:42px;height:42px;border-radius:8px}.brand{font-weight:800;line-height:1.1;letter-spacing:.5px}.brand small{display:block;font-weight:500;font-size:12px;opacity:.9;letter-spacing:0}
.sp{flex:1}
nav.t{display:flex;gap:4px}nav.t a,nav.b a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
nav.t a.on{background:rgba(255,255,255,.22);font-weight:700}
nav.b{display:none}
@media(max-width:760px){nav.t{display:none}
 nav.b{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;justify-content:space-around}
 nav.b a{flex-direction:column;gap:2px;font-size:11px;color:var(--mut);padding:6px 8px}nav.b a.on{color:var(--blue);font-weight:700}nav.b a span{font-size:20px}
 .brand small{display:none}}
.hero{background:var(--blue);color:#fff;text-align:center;padding:34px 18px 40px}
.hero img{width:170px;max-width:60%;border-radius:12px}.hero h1{margin:14px 0 6px;font-size:26px}.hero p{margin:0 auto 18px;max-width:460px;opacity:.92}
main{padding:18px;max-width:1100px;margin:auto}
h2{margin:20px 0 12px;font-size:20px;color:var(--navy)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:#fff}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat span{color:var(--mut);font-size:13px}.stat b{display:block;font-size:24px;margin-top:4px}
.emp{cursor:pointer;text-align:center;padding:22px 12px;transition:transform .15s,box-shadow .15s;border-top:4px solid var(--blue)}.emp:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(30,104,169,.2)}
.av{overflow:hidden;width:88px;height:88px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;margin:0 auto 10px}
.av img{width:100%;height:100%;object-fit:cover;object-position:top}.emp h3{margin:4px 0;font-size:16px}.mut{color:var(--mut);font-size:13px}.lock{font-size:12px;color:var(--mut);margin-top:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600}
.in{color:var(--ok);font-weight:700}.out{color:var(--bad);font-weight:700}
input,select{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-top:4px}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.md{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:380px;max-height:90%;overflow:auto}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}.info{background:var(--tint);border-radius:12px;padding:14px;margin-top:18px;font-size:14px}
.vit{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.lc{padding:0;overflow:hidden}
.ph{position:relative;aspect-ratio:4/3;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:42px}.ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;left:8px;background:var(--blue);color:#fff;font-size:12px;padding:3px 10px;border-radius:20px}.tag.sold{background:var(--bad)}
.lb{padding:12px 14px}.lb>b{font-size:20px;color:var(--blue)}.la{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.la button{padding:6px 10px;font-size:13px}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
h2,h3,.brand,.stat b,.lb>b,.hero h1,th{font-family:"Plus Jakarta Sans","Inter",system-ui,sans-serif;letter-spacing:-.01em}
button,input,select{font-family:inherit}.brand{font-weight:800;letter-spacing:.04em}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
nav.t a{font-weight:500;letter-spacing:.01em}nav.t a span{display:flex}nav.b a span{display:flex}
.card{box-shadow:0 1px 3px rgba(16,40,70,.06)}.emp h3{font-weight:700;letter-spacing:.02em}
.ph .ic{width:44px;height:44px;opacity:.4;stroke-width:1.3;color:var(--blue)}.lock{display:flex;align-items:center;justify-content:center;gap:6px}
h2 .ic{color:var(--blue);margin-right:4px}
.br{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.bl{width:96px;flex:none;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{flex:1;background:var(--tint);border-radius:6px;height:12px;overflow:hidden}.bt i{display:block;height:100%;background:var(--blue);border-radius:6px}.br b{min-width:84px;text-align:right}
.tag2{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--tint);color:var(--blue);font-weight:600}.tag2.hot{background:#fde8e6;color:#c0392b}.tag2.cold{background:#e7edf3;color:#667689}
.lk{color:var(--blue);text-decoration:none;margin-right:12px;font-size:14px;white-space:nowrap}.clk{cursor:pointer}.clk:hover td{background:var(--tint)}
nav.b{overflow-x:auto;justify-content:flex-start}nav.b a{min-width:70px;flex:none}
@media print{header,nav,button{display:none!important}body{padding:0;background:#fff}}
</style>

 <div class="grid"><div class="card stat"><span>${nm} Gelir (${cl})</span><b class="in">${money(c.i)}</b></div><div class="card stat"><span>${nm} Gider</span><b class="out">${money(c.o)}</b></div><div class="card stat"><span>${nm} Net</span><b class="${nt>=0?'in':'out'}">${money(nt)}</b></div></div>

 ${catHtml()}<h2>Kayıtlar</h2><div class="card tw"><table><tr><th>Tarih</th><th>Açıklama</th><th>Tekrar</th><th>Tutar</th><th></th></tr>

 $('#im').onclick=()=>$('#fi').click();
